<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101714" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:," />
    <title>Kontak</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap');

      :root {
        color-scheme: light dark;
        --bg: #f2f4ef;
        --panel: #ffffff;
        --ink: #14201b;
        --muted: #617068;
        --line: #cbd2cc;
        --accent: #d9ff3f;
        --accent-ink: #18210c;
        --dark-tile: #17221d;
        --dark-tile-ink: #f7f8f4;
        --shadow: 0 26px 70px rgba(35, 50, 42, .12);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101714;
          --panel: #18211d;
          --ink: #f3f5ef;
          --muted: #a9b7af;
          --line: #35413b;
          --accent: #d9ff3f;
          --accent-ink: #18210c;
          --dark-tile: #f0f3ed;
          --dark-tile-ink: #17211c;
          --shadow: 0 28px 75px rgba(0, 0, 0, .34);
        }
      }

      * { box-sizing: border-box; }

      html { min-height: 100%; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        font-family: "DM Sans", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px),
          var(--bg);
        background-size: 34px 34px;
      }

      button, a { font: inherit; }

      .page {
        width: min(100%, 1020px);
        min-height: calc(100vh - 44px);
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, .86fr) minmax(330px, 1.14fr);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 26px 8px 26px 8px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .identity {
        position: relative;
        min-height: 590px;
        padding: clamp(32px, 5vw, 66px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }

      .identity::after {
        content: "";
        position: absolute;
        right: -95px;
        bottom: -105px;
        width: 300px;
        height: 300px;
        border: 58px solid var(--accent);
        border-radius: 50%;
        opacity: .9;
        pointer-events: none;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        width: fit-content;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .status::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent);
      }

      .intro { position: relative; z-index: 1; }

      h1 {
        margin: 0;
        max-width: 440px;
        font-family: "Newsreader", serif;
        font-size: clamp(52px, 6.4vw, 80px);
        line-height: .9;
        letter-spacing: -.065em;
        font-weight: 600;
      }

      .hello {
        margin: 26px 0 0;
        max-width: 340px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.65;
      }

      .link-panel {
        padding: clamp(20px, 4vw, 48px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: color-mix(in srgb, var(--bg) 56%, var(--panel));
        border-left: 1px solid var(--line);
      }

      .link-list {
        display: grid;
        gap: 14px;
      }

      .link-card {
        position: relative;
        width: 100%;
        min-height: 118px;
        padding: 21px 20px;
        display: grid;
        grid-template-columns: 48px 1fr 38px;
        align-items: center;
        gap: 16px;
        border: 1px solid var(--line);
        border-radius: 7px 19px 7px 19px;
        color: var(--ink);
        background: var(--panel);
        text-decoration: none;
        text-align: left;
        cursor: pointer;
        transition: transform 180ms ease, border-color 180ms ease, background-color 180ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .link-card:hover,
      .link-card:focus-visible {
        transform: translateX(5px);
        border-color: var(--ink);
        outline: none;
      }

      .link-card.primary {
        background: var(--dark-tile);
        color: var(--dark-tile-ink);
        border-color: var(--dark-tile);
      }

      .link-card.primary:hover,
      .link-card.primary:focus-visible { border-color: var(--accent); }

      .icon-wrap {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border: 1px solid currentColor;
        border-radius: 50%;
        opacity: .92;
      }

      .icon-wrap svg { width: 22px; height: 22px; }

      .text { min-width: 0; }

      .label {
        display: block;
        margin-bottom: 5px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .09em;
        text-transform: uppercase;
        opacity: .65;
      }

      .value {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: clamp(17px, 2vw, 20px);
        font-weight: 600;
        letter-spacing: -.025em;
      }

      .action {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-ink);
      }

      .action svg { width: 18px; height: 18px; }

      .foot {
        margin: 30px 4px 0;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 720px) {
        body {
          padding: 0;
          background: var(--panel);
        }

        .page {
          min-height: 100vh;
          display: block;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }

        .identity {
          min-height: 350px;
          padding: max(30px, env(safe-area-inset-top)) 24px 38px;
        }

        .identity::after {
          width: 220px;
          height: 220px;
          right: -94px;
          bottom: -88px;
          border-width: 44px;
        }

        h1 {
          max-width: 320px;
          font-size: clamp(54px, 17vw, 74px);
        }

        .hello {
          max-width: 280px;
          margin-top: 19px;
          font-size: 14px;
        }

        .link-panel {
          padding: 25px 18px max(28px, env(safe-area-inset-bottom));
          border-left: 0;
          border-top: 1px solid var(--line);
        }

        .link-card {
          min-height: 104px;
          padding: 17px 15px;
          grid-template-columns: 44px minmax(0, 1fr) 36px;
          gap: 13px;
        }

        .icon-wrap { width: 44px; height: 44px; }
        .action { width: 36px; height: 36px; }
        .value { font-size: 17px; }
        .foot { margin-top: 22px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .link-card { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="identity" aria-labelledby="page-heading">
        <div class="status">Mari terhubung</div>
        <div class="intro">
          <h1 id="page-heading">Your personal<br>trainer.</h1>
          <p class="hello">Ikuti Instagram, chat lewat WhatsApp, atau kunjungi website.</p>
        </div>
      </section>

      <section class="link-panel" aria-label="Tautan kontak">
        <div class="link-list">
          <a class="link-card primary" href="https://www.instagram.com/stri2a_?stkn=Z2p2ZjJ6bXZ2aDZq" target="_blank" rel="noopener noreferrer" aria-label="Buka Instagram @stri2a_">
            <span class="icon-wrap" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/>
              </svg>
            </span>
            <span class="text">
              <span class="label">Instagram</span>
              <span class="value">@stri2a_</span>
            </span>
            <span class="action" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
            </span>
          </a>

          <a class="link-card" href="https://wa.me/6288287269056" target="_blank" rel="noopener noreferrer" aria-label="Buka chat WhatsApp 088287269056">
            <span class="icon-wrap" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5Z"/><path d="M8.5 8.3c.3 2.9 2.3 5 5.2 5.7l1.2-1.2c.2-.2.5-.2.7-.1l2 .9"/>
              </svg>
            </span>
            <span class="text">
              <span class="label">WhatsApp</span>
              <span class="value">0882 8726 9056</span>
            </span>
            <span class="action" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
            </span>
          </a>

          <a class="link-card" href="https://yourtrainer.my.id/?utm_source=ig&utm_medium=social&utm_content=link_in_bio" target="_blank" rel="noopener noreferrer" aria-label="Buka website yourtrainer.my.id">
            <span class="icon-wrap" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.2 2.5 3.3 5.5 3.3 9S14.2 18.5 12 21M12 3C9.8 5.5 8.7 8.5 8.7 12s1.1 6.5 3.3 9"/>
              </svg>
            </span>
            <span class="text">
              <span class="label">Website</span>
              <span class="value">yourtrainer.my.id</span>
            </span>
            <span class="action" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
            </span>
          </a>
        </div>

        <p class="foot">Instagram · WhatsApp · Website</p>
      </section>
    </main>

  </body>
</html>
